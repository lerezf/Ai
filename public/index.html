<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Nova</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Conversations">
        <div class="sidebar-head">
          <div class="brand">
            <img src="/icon.svg" alt="" width="28" height="28" />
            <span id="brand-name">Nova</span>
          </div>
          <button class="btn primary" id="new-chat" type="button">
            <span aria-hidden="true">+</span> New chat
          </button>
        </div>
        <nav class="chat-list" id="chat-list"></nav>
        <button class="btn ghost" id="open-settings" type="button">Personalize</button>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="toggle-sidebar" type="button" aria-label="Show conversations">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <h1 id="chat-title">New chat</h1>
        </header>

        <section class="messages" id="messages" aria-live="polite"></section>

        <form class="composer" id="composer" autocomplete="off">
          <div class="composer-box">
            <textarea
              id="input"
              rows="1"
              placeholder="Message Nova…"
              aria-label="Your message"
            ></textarea>
            <button class="send" id="send" type="submit" aria-label="Send message">
              <svg class="i-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <svg class="i-stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor" />
              </svg>
            </button>
          </div>
          <p class="hint">Enter to send · Shift+Enter for a new line · Nova can make mistakes.</p>
        </form>
      </main>
    </div>

    <dialog class="settings" id="settings">
      <form method="dialog" id="settings-form">
        <h2>Personalize your AI</h2>
        <label>
          <span>Name</span>
          <input id="set-name" type="text" maxlength="40" placeholder="Nova" />
        </label>
        <label>
          <span>Personality &amp; instructions</span>
          <textarea
            id="set-instructions"
            rows="5"
            maxlength="4000"
            placeholder="e.g. Talk like a cheerful pirate. Keep answers short. I'm learning Spanish, so mix some in."
          ></textarea>
        </label>
        <div class="dialog-actions">
          <button class="btn ghost" type="button" id="settings-cancel">Cancel</button>
          <button class="btn primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
